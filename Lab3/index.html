<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamiento Inteligente</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="contenedor">

        <div id="titulo">
            <i>ESTACIONAMIENTO INTELIGENTE · TEC DE MONTERREY QRO</i>
        </div>

        <div id="principal">

            <div id="mapa"></div>

            <div id="panel">
                <h2>DASHBOARD</h2>

                <div class="dato"><span>Total de espacios</span><b id="total">0</b></div>
                <div class="dato"><span>Ocupados</span><b id="ocupados" class="rojo">0</b></div>
                <div class="dato"><span>Disponibles</span><b id="disponibles" class="verde">0</b></div>
                <div class="dato"><span>Ocupación</span><b id="porcentaje">0%</b></div>

                <div id="barra"><div id="relleno"></div></div>

                <div id="leyenda">
                    <span class="punto libre"></span> Disponible
                    <span class="punto ocupado"></span> Ocupado
                    <br><br>
                    DISC = Discapacitados &nbsp;&nbsp; DESC = Descarga
                </div>
            </div>

        </div>

        <div id="pie">
            <i>HAZ CLIC EN UN CAJÓN PARA CAMBIAR SU ESTADO</i>
        </div>

    </div>

<script>
    var escala = 900 / 1522;
    var mapa = document.getElementById("mapa");

    // Crea una fila de cajones
    // x, y = centro del primer cajón | dx, dy = cuánto se mueve cada cajón
    // ancho = profundidad del cajón | alto = largo a lo largo de la fila | giro = grados
    function crearFila(x, y, dx, dy, cantidad, ancho, alto, giro) {
        for (var i = 0; i < cantidad; i++) {
            var div = document.createElement("div");
            div.className = "cajon libre";
            div.style.width = ancho * escala + "px";
            div.style.height = alto * escala + "px";
            div.style.left = (x + i * dx - ancho / 2) * escala + "px";
            div.style.top = (y + i * dy - alto / 2) * escala + "px";
            div.style.transform = "rotate(" + giro + "deg)";
            div.setAttribute("onclick", "cambiar(this)");
            mapa.appendChild(div);
        }
    }

    // Marca un cajón como especial (palabra y borde de color)
    function marcar(cajon, palabra, color) {
        cajon.innerHTML = "<span style='display:inline-block; transform:rotate(-61deg)'>" + palabra + "</span>";
        cajon.style.border = "2px solid " + color;
    }

    // 5 bloques centrales (2 filas de 17 cada uno)
    crearFila(262, 605, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(330, 575, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(445, 497, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(513, 467, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(651, 397, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(719, 367, 16.1, 33.1, 17, 60, 37, -26);
    crearFila(815, 300, 13.9, 28.8, 17, 60, 32, -26);
    crearFila(883, 270, 13.7, 28.8, 17, 60, 32, -25);
    crearFila(1030, 185, 13.4, 28.4, 17, 60, 31, -25);
    crearFila(1098, 155, 13.2, 28.4, 17, 60, 31, -25);

    // 17 lugares abajo de los árboles (lado izquierdo)
    crearFila(205, 815, 9.2, 19.1, 17, 34, 21, -26);

    // Junto al Oxxo: 13 lugares (10 normales + 3 especiales)
    crearFila(1326, 736, -43.6, 24.4, 13, 34, 50, 61);
    var n = mapa.children.length;
    marcar(mapa.children[n - 13], "DISC", "#38bdf8");   // primero: discapacitados
    marcar(mapa.children[n - 2], "DISC", "#38bdf8");    // penúltimo: discapacitados
    marcar(mapa.children[n - 1], "DESC", "#facc15");    // último: descarga

    // 15 lugares hasta arriba (dentro del cuadro rojo)
    crearFila(565, 320, 35.7, -18.8, 15, 34, 40, -118);

    // Todos los cajones del mapa
    var todos = document.getElementsByClassName("cajon");

    // Cambia el estado de un cajón (clic o sensor)
    function cambiar(cajon) {
        if (cajon.className == "cajon libre") {
            cajon.className = "cajon ocupado";
        } else {
            cajon.className = "cajon libre";
        }
        actualizar();
    }

    // Calcula y muestra los datos del dashboard
    function actualizar() {
        var total = todos.length;
        var ocupados = document.getElementsByClassName("cajon ocupado").length;
        var porcentaje = Math.round(ocupados / total * 100);

        document.getElementById("total").innerHTML = total;
        document.getElementById("ocupados").innerHTML = ocupados;
        document.getElementById("disponibles").innerHTML = total - ocupados;
        document.getElementById("porcentaje").innerHTML = porcentaje + "%";
        document.getElementById("relleno").style.width = porcentaje + "%";
    }

    // Sensores: estado inicial aleatorio
    for (var i = 0; i < todos.length; i++) {
        if (Math.random() < 0.6) {
            todos[i].className = "cajon ocupado";
        }
    }
    actualizar();

    // Cada 2 segundos un sensor cambia solo
    setInterval(function () {
        var m = Math.floor(Math.random() * todos.length);
        cambiar(todos[m]);
    }, 2000);
</script>

</body>
</html>
